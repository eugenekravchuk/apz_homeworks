syntax = "proto3";
package logging;

message LogRequest {
  string id = 1;
  string message = 2;
}

message LogResponse {
  bool deduplicated = 1;
}

message GetLogsRequest {}

message GetLogsResponse {
  repeated string messages = 1;
}

service LoggingService {
  rpc AddLog(LogRequest) returns (LogResponse);
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse);
}
