services:

  # ── Hazelcast cluster (3 nodes) ──────────────────────────────────────────────
  hazelcast-1:
    image: hazelcast/hazelcast:5.3
    environment:
      HZ_CLUSTERNAME: dev
      HZ_NETWORK_JOIN_TCPIP_ENABLED: "true"
      HZ_NETWORK_JOIN_TCPIP_MEMBERS: "hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701"
      HZ_NETWORK_JOIN_MULTICAST_ENABLED: "false"
      HZ_NETWORK_PUBLICADDRESS: "hazelcast-1:5701"
    ports:
      - "5701:5701"
    networks:
      - apz-net

  hazelcast-2:
    image: hazelcast/hazelcast:5.3
    environment:
      HZ_CLUSTERNAME: dev
      HZ_NETWORK_JOIN_TCPIP_ENABLED: "true"
      HZ_NETWORK_JOIN_TCPIP_MEMBERS: "hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701"
      HZ_NETWORK_JOIN_MULTICAST_ENABLED: "false"
      HZ_NETWORK_PUBLICADDRESS: "hazelcast-2:5701"
    ports:
      - "5702:5701"
    networks:
      - apz-net

  hazelcast-3:
    image: hazelcast/hazelcast:5.3
    environment:
      HZ_CLUSTERNAME: dev
      HZ_NETWORK_JOIN_TCPIP_ENABLED: "true"
      HZ_NETWORK_JOIN_TCPIP_MEMBERS: "hazelcast-1:5701,hazelcast-2:5701,hazelcast-3:5701"
      HZ_NETWORK_JOIN_MULTICAST_ENABLED: "false"
      HZ_NETWORK_PUBLICADDRESS: "hazelcast-3:5701"
    ports:
      - "5703:5701"
    networks:
      - apz-net

  # ── PostgreSQL (for counter-service) ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: counter
      POSTGRES_DB: counter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - apz-net

  # ── logging-service (3 instances) ────────────────────────────────────────────
  logging-1:
    build:
      context: .
      dockerfile: logging-service/Dockerfile
    environment:
      LOGGING_PORT: "4000"
      LOGGING_GRPC_PORT: "50051"
      HAZELCAST_ADDR: "hazelcast-1:5701"
      SERVICE_INSTANCE: "logging-1"
    ports:
      - "4001:4000"
      - "50051:50051"
    depends_on:
      - hazelcast-1
      - hazelcast-2
      - hazelcast-3
    networks:
      - apz-net

  logging-2:
    build:
      context: .
      dockerfile: logging-service/Dockerfile
    environment:
      LOGGING_PORT: "4000"
      LOGGING_GRPC_PORT: "50051"
      HAZELCAST_ADDR: "hazelcast-2:5701"
      SERVICE_INSTANCE: "logging-2"
    ports:
      - "4002:4000"
      - "50052:50051"
    depends_on:
      - hazelcast-1
      - hazelcast-2
      - hazelcast-3
    networks:
      - apz-net

  logging-3:
    build:
      context: .
      dockerfile: logging-service/Dockerfile
    environment:
      LOGGING_PORT: "4000"
      LOGGING_GRPC_PORT: "50051"
      HAZELCAST_ADDR: "hazelcast-3:5701"
      SERVICE_INSTANCE: "logging-3"
    ports:
      - "4003:4000"
      - "50053:50051"
    depends_on:
      - hazelcast-1
      - hazelcast-2
      - hazelcast-3
    networks:
      - apz-net

  # ── counter-service ───────────────────────────────────────────────────────────
  counter-service:
    build: ./counter-service
    environment:
      COUNTER_PORT: "5000"
      DATABASE_URL: "postgresql://counter:counter@postgres:5432/counter"
      STATIC_MESSAGE: "not implemented yet"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - apz-net

  # ── facade-service ────────────────────────────────────────────────────────────
  facade-service:
    build:
      context: .
      dockerfile: facade-service/Dockerfile
    environment:
      FACADE_PORT: "3000"
      LOGGING_GRPC_ADDRS: "logging-1:50051,logging-2:50051,logging-3:50051"
      COUNTER_SERVICE_URL: "http://counter-service:5000"
    ports:
      - "3000:3000"
    depends_on:
      - logging-1
      - logging-2
      - logging-3
      - counter-service
    networks:
      - apz-net

networks:
  apz-net:
    driver: bridge

volumes:
  postgres-data:
